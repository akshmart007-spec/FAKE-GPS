name: Build APK


on:
  push:
    branches: [main, master]
  workflow_dispatch:


permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - name: Unzip project.zip
        run: |
          if [ -f project.zip ]; then
            echo "Found project.zip — extracting..."
            unzip -o project.zip -x ".github/*"
          else
            echo "No project.zip — using repo files"
          fi
          echo "---- workspace ----"
          ls -la
          echo "---- app ----"
          ls -la app || true
          echo "---- keystore ----"
          ls -la keystore.jks || true


      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7


      - name: Build release APK
        run: |
          gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace


      - name: Rename APK
        run: |
          ls -la app/build/outputs/apk/release/ || true
          cp app/build/outputs/apk/release/app-release.apk FakeGPSLock.apk
          ls -la FakeGPSLock.apk


      - uses: actions/upload-artifact@v4
        with:
          name: FakeGPSLock-apk
          path: FakeGPSLock.apk
          if-no-files-found: error


      - name: Publish release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Version ${{ github.run_number }}
          files: FakeGPSLock.apk
          generate_release_notes: false
